name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Build, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Compiles the fenced TypeScript blocks in docs/cortex/consumer-guide.md
      # against framework source. Deliberately not part of `npm run typecheck`,
      # which the pre-commit hook runs: coupling every commit in every package
      # to the guide compiling is a blast radius that gets the check disabled.
      - name: Docs examples
        run: npm run typecheck:docs

      - name: Test
        run: npm run test:run

      # The run above resolves @animus-labs/cortex to framework source, so it
      # can never answer about a stale build. That leaves one thing it cannot
      # see: whether the package a consumer actually installs works. Run the
      # only in-repo consumer's suite once more against the built artifact,
      # which exercises the exports map and the files list too.
      - name: Test the consumer against the built framework package
        run: npm run test:run -w packages/cortex-code
        env:
          CORTEX_TEST_TARGET: dist

      # Stage the release tarballs (the main package with its Windows variant
      # alias, and the package.json-only variant), publish them to a throwaway
      # local registry, and install: on Linux neither the variant nor the MXC
      # SDK may be installed. See tools/release/verify-cortex-install.mjs.
      - name: Packaging
        run: node tools/release/verify-cortex-install.mjs

      - name: Lint
        run: npm run lint

  windows:
    name: Windows shell and provider setup
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A real Windows install of the staged packages: npm installs the
      # Windows variant and the MXC SDK, and the installed Cortex resolves it.
      - name: Packaging
        run: node tools/release/verify-cortex-install.mjs

      # Exercise real PowerShell 7 and 5.1 processes. Browser launching uses a
      # mocked OS handler because hosted runners have no interactive desktop.
      # The MXC tests run the launcher entry point and proxy on win32 against a
      # fake SDK; this Windows Server image cannot run real MXC containment.
      - name: Test Windows command execution and OAuth setup
        run: >-
          npx vitest run
          packages/cortex/tests/unit/tools/bash-shell.test.ts
          packages/cortex/tests/unit/tools/bash-windows.integration.test.ts
          packages/cortex/tests/unit/sandbox/mxc-request.test.ts
          packages/cortex/tests/unit/sandbox/mxc-host.test.ts
          packages/cortex/tests/unit/sandbox/mxc-launcher.test.ts
          packages/cortex/tests/unit/sandbox/mxc.test.ts
          packages/cortex/tests/unit/sandbox/factory.test.ts
          packages/cortex-code/tests/providers/browser-auth.test.ts
          packages/cortex-code/tests/providers/setup-tui-render.test.ts
          packages/cortex-code/tests/providers/setup-tui-input.test.ts

  # Windows 11 on ARM64, the one hosted Windows 11 image (free for public
  # repositories). MXC needs Windows 11 with the process security environment,
  # which KB5120998 rolls out gradually, so each run's probe decides whether
  # this image can contain anything; nothing assumes it. Off pull requests:
  # it installs the real SDK and runs real containment. It uses no secrets.
  #
  # When the probe reports MXC unavailable, the job still passes (packaging
  # was verified), but the checklist step shows as skipped, a warning
  # annotation says Windows containment was NOT validated, and the probe's
  # section of the job summary is headed "NOT available". Failing instead
  # would turn every push red for a reason outside this repository until
  # Microsoft enables the feature on the image, and a job that is always red
  # stops being read, which would hide a real packaging failure here. Once the
  # probe passes, any checklist failure fails the job.
  windows-arm:
    name: Windows 11 ARM64 packaging and MXC real host
    if: github.event_name != 'pull_request'
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      # MXC's native stdio transfer needs Node 24.21+ (or 26.8+). Fail here so
      # an old Node is never reported as an unavailable host.
      - name: Check Node supports MXC
        shell: bash
        run: >-
          node -e "const [major, minor] = process.versions.node.split('.').map(Number);
          if (!((major === 24 && minor >= 21) || (major === 26 && minor >= 8) || major > 26)) {
          console.error('Node ' + process.version + ' cannot run MXC (needs 24.21+ or 26.8+)'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Packaging
        run: node tools/release/verify-cortex-install.mjs

      # Only the published package depends on the SDK (through the Windows
      # variant), so install the release's pinned version for the probe and
      # the checklist, without touching package.json or the lockfile.
      - name: Install the pinned MXC SDK
        shell: bash
        run: |
          sdk="$(node --input-type=module -e "const { MXC_SDK } = await import('./tools/release/cortex-packages.mjs'); console.log(MXC_SDK.name + '@' + MXC_SDK.version)")"
          npm install --no-save --no-audit --no-fund "${sdk}"

      - name: MXC probe
        id: probe
        run: node tools/mxc/probe-report.mjs

      # The automatable part of docs/cortex/windows-sandbox-build.md. With
      # CORTEX_MXC_REAL_HOST=1 the suite fails, rather than skips, when MXC
      # turns out to be unavailable.
      - name: MXC real-host checklist
        if: steps.probe.outputs.available == 'true'
        env:
          CORTEX_MXC_REAL_HOST: "1"
        run: npx vitest run packages/cortex/tests/unit/sandbox/mxc-real-host.integration.test.ts

      - name: Flag that Windows containment was not validated
        if: steps.probe.outputs.available != 'true'
        shell: bash
        run: |
          message="MXC BaseContainer is not available on this windows-11-arm image, so the real-host checklist did not run. Packaging was verified; Windows containment was NOT. See the MXC probe in the job summary."
          echo "::warning title=Windows containment NOT validated::${message}"
          printf '\n> [!WARNING]\n> %s\n' "${message}" >> "${GITHUB_STEP_SUMMARY}"
