name: Release Cortex

on:
  push:
    tags:
      - "cortex-v*"

permissions:
  contents: read

env:
  PACKAGE_NAME: "@animus-labs/cortex"
  PACKAGE_DIR: "packages/cortex"
  TAG_PREFIX: "cortex-v"
  NPM_VERSION: "11.18.0"

concurrency:
  group: release-cortex-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm CLI
        run: npm install -g npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: |
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          expected_tag="${TAG_PREFIX}${version}"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${PACKAGE_NAME} version ${version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

          if ! grep -q "^## ${version}" "${PACKAGE_DIR}/CHANGELOG.md"; then
            echo "${PACKAGE_DIR}/CHANGELOG.md must contain a ## ${version} entry."
            exit 1
          fi

          # The Windows variant may already be live from an earlier run that
          # failed before the main package; the publish job skips it then.
          if npm view "${PACKAGE_NAME}@${version}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${version} is already published."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck -w packages/cortex

      - name: Build
        run: npm run build -w packages/cortex

      - name: Test
        run: npm run test:run -w packages/cortex

      # Two tarballs: the Windows variant (package.json only, depends on the
      # pinned MXC SDK, os win32) and the main package, identical to npm pack
      # except for the optional dependency alias that names the variant. See
      # tools/release/cortex-packages.mjs.
      - name: Stage packages
        run: node tools/release/stage-cortex.mjs --out release-artifacts

      # Publish both to a throwaway local registry the way the publish job does,
      # install, and check that Linux gets neither the variant nor the SDK.
      - name: Verify the staged install on Linux
        run: node tools/release/verify-cortex-install.mjs --tarballs release-artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-package
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  # The same check on a real Windows install, against the exact tarballs the
  # publish job publishes: npm installs the variant and the SDK, and the
  # installed Cortex resolves it, hoisted and in npm's nested layout. Needs only
  # the release tools from the checkout, not the project's dependencies.
  verify-windows:
    name: Verify the staged install on Windows
    runs-on: windows-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm CLI
        shell: bash
        run: npm install -g npm@${NPM_VERSION} --ignore-scripts

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: cortex-package
          path: release-artifacts

      - name: Verify the staged install on Windows
        run: node tools/release/verify-cortex-install.mjs --tarballs release-artifacts

  publish:
    name: Publish packages to npm
    runs-on: ubuntu-latest
    needs: [verify, verify-windows]
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm CLI
        run: npm install -g npm@${NPM_VERSION} --ignore-scripts

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: cortex-package
          path: release-artifacts

      # The Windows variant goes first, under its own dist-tag. The main
      # package names it as an optional dependency, and npm silently installs
      # without an optional dependency it cannot resolve, so a main package
      # live before its variant leaves Windows installs without the SDK. npm
      # refuses a prerelease without --tag, and the tag keeps `latest` on the
      # main package. Trusted publishing (OIDC) authenticates both publishes
      # and attaches provenance; the npm-publish environment's approval is the
      # one human gate.
      - name: Publish packages
        run: |
          set -o pipefail
          version="${GITHUB_REF_NAME#"${TAG_PREFIX}"}"
          variant="./release-artifacts/animus-labs-cortex-${version}-win32.tgz"
          main="./release-artifacts/animus-labs-cortex-${version}.tgz"
          tarball_count="$(find release-artifacts -name '*.tgz' | wc -l | tr -d ' ')"
          if [ "${tarball_count}" != "2" ] || [ ! -f "${variant}" ] || [ ! -f "${main}" ]; then
            echo "Expected exactly ${variant} and ${main}, found:"
            ls release-artifacts
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${version}-win32" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${version}-win32 is already live; publishing the main package only."
          else
            npm publish "${variant}" --access public --tag win32 --provenance
          fi

          # Publish the main package only once the registry serves the variant.
          for attempt in $(seq 1 30); do
            if npm view "${PACKAGE_NAME}@${version}-win32" version >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" = "30" ]; then
              echo "${PACKAGE_NAME}@${version}-win32 is not visible on the registry; not publishing ${version}."
              exit 1
            fi
            sleep 10
          done

          npm publish "${main}" --access public --provenance

          {
            echo "## Published ${PACKAGE_NAME} ${version}"
            echo
            echo "- \`${version}-win32\` (dist-tag \`win32\`)"
            echo "- \`${version}\` (dist-tag \`latest\`)"
          } >> "${GITHUB_STEP_SUMMARY}"
