name: Release Cortex Code

on:
  push:
    tags:
      - "cortex-code-v*"

permissions:
  contents: read

env:
  PACKAGE_NAME: "@animus-labs/cortex-code"
  PACKAGE_DIR: "packages/cortex-code"
  TAG_PREFIX: "cortex-code-v"
  NPM_VERSION: "11.18.0"

concurrency:
  group: release-cortex-code-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm CLI
        run: npm install -g npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: |
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          expected_tag="${TAG_PREFIX}${version}"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${PACKAGE_NAME} version ${version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

          if ! grep -q "^## ${version}" "${PACKAGE_DIR}/CHANGELOG.md"; then
            echo "${PACKAGE_DIR}/CHANGELOG.md must contain a ## ${version} entry."
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${version}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${version} is already published."
            exit 1
          fi

      - name: Check published workspace dependencies
        run: |
          for dependency in cortex; do
            range="$(node -p "require('./${PACKAGE_DIR}/package.json').dependencies['@animus-labs/${dependency}']")"
            npm view "@animus-labs/${dependency}@${range}" version
          done

      # Dependencies first. Every workspace cortex-code imports resolves to a
      # gitignored dist and none of them has a prepare script, so on a clean
      # runner @animus-labs/cortex and /brand do not exist
      # until something builds them. Typechecking or testing before that point
      # does not fail safe: verified on a clean checkout, tsc reports TS2307
      # across the package and 28 of 66 test files fail to import. On a runner
      # where a dist happens to be lying around it is worse, because the job
      # then certifies whatever build that was rather than the one it packs.
      # The enumeration below is what drifted (it named only cortex, and
      # cortex-code imports two). Keeping it explicit rather than building
      # every workspace avoids dragging apps/ into a package release; the
      # Typecheck step immediately after is the drift guard, since a
      # dependency added later and not built here fails there with TS2307.
      - name: Build workspace dependencies
        run: npm run build -w packages/brand -w packages/cortex

      - name: Typecheck
        run: npm run typecheck -w packages/cortex-code

      # Against the built package, not framework source: this job exists to
      # certify the artifact.
      - name: Test
        run: npm run test:run -w packages/cortex-code
        env:
          CORTEX_TEST_TARGET: dist

      - name: Build Cortex Code
        run: npm run build -w packages/cortex-code

      - name: Pack package
        run: |
          mkdir -p release-artifacts
          npm pack -w packages/cortex-code --pack-destination release-artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-code-package
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish package to npm
    runs-on: ubuntu-latest
    needs: verify
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm CLI
        run: npm install -g npm@${NPM_VERSION} --ignore-scripts

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: cortex-code-package
          path: release-artifacts

      # Trusted publishing (OIDC) authenticates the publish and attaches
      # provenance; the npm-publish environment's approval is the one human gate.
      - name: Publish package
        run: |
          tarball_count="$(find release-artifacts -name '*.tgz' | wc -l | tr -d ' ')"
          if [ "${tarball_count}" != "1" ]; then
            echo "Expected exactly one package artifact, found ${tarball_count}."
            exit 1
          fi

          tarball="$(find release-artifacts -name '*.tgz' -print -quit)"
          npm publish "${tarball}" --access public --provenance
